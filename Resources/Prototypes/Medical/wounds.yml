    maximumDamage: 5
    group: Brute
  - type: WoundDescription
    descriptions:
      0.0: wound-brute-tiny
  - type: WoundGerm
  - type: HealableWound
    healPerTick: 0.15
  - type: PainfulWound
    painAmount: 0.5
    freshPainAmount: 1

- type: entity
