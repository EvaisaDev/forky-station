# Implant surgery steps — requires stage Retracted or Encased on the Torso

- type: surgeryStep
  id: ImplantItem
  action: ImplantItem
  name: Implant item
  description: Inserts a small item into the body cavity.
  allowedTools:
    Retractor: 100
    Hemostat: 75
  requiredFlags: 0
  minDuration: 5.0
  maxDuration: 8.0
  canInfect: true
  bloodLevel: 1
  shockLevel: 10
  delicate: true

- type: surgeryStep
  id: RemoveImplanted
  action: RemoveImplanted
  name: Remove implant
  description: Removes an implanted item from the body cavity.
  allowedTools:
    Hemostat: 100
    Forceps: 75
  requiredFlags: 0
  minDuration: 4.0
  maxDuration: 6.0
  canInfect: true
  bloodLevel: 1
  shockLevel: 10
  delicate: true
