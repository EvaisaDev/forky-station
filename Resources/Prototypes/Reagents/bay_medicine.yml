# Baystation-style medical reagents (new additions).
# Reagents that already exist in medicine.yml are NOT redefined here.

- type: reagent
  id: Paracetamol
  name: reagent-name-paracetamol
  group: Medicine
  desc: reagent-desc-paracetamol
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#bababa"
  bioavailability: 0.6
  metabolismRate: 0.02
  overdoseThreshold: 60
  metabolisms:
    Bloodstream:
      effects:
      - !type:GenericStatusEffect
        key: Jitter
        time: 3.0
        type: Remove
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-feel-painkiller" ]

