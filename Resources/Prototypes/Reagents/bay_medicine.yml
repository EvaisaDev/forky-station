# Baystation-style medical reagents (new additions).
# Reagents that already exist in medicine.yml are NOT redefined here.

- type: reagent
  id: Paracetamol
  name: reagent-name-paracetamol
  group: Medicine
  desc: reagent-desc-paracetamol
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#bababa"
  bioavailability: 0.6
  metabolismRate: 0.02
  overdoseThreshold: 60
  metabolisms:
    Bloodstream:
      effects:
      - !type:GenericStatusEffect
        key: Jitter
        time: 3.0
        type: Remove
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-feel-painkiller" ]

- type: reagent
  id: Tramadol
  name: reagent-name-tramadol
  group: Medicine
  desc: reagent-desc-tramadol
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#cbccfc"
  bioavailability: 0.6
  metabolismRate: 0.05
  overdoseThreshold: 30
  activeMetabolite: Opiates
  metabolitePotency: 2.0
  metabolisms:
    Bloodstream:
      effects:
      - !type:GenericStatusEffect
        key: Jitter
        time: 5.0
        type: Remove

- type: reagent
  id: Oxycodone
  name: reagent-name-oxycodone
  group: Medicine
  desc: reagent-desc-oxycodone
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#e09fa0"
  bioavailability: 0.6
  metabolismRate: 0.02
  overdoseThreshold: 20
  activeMetabolite: Opiates
  metabolitePotency: 5.0
  metabolisms:
    Bloodstream:
      effects:
      - !type:GenericStatusEffect
        key: Jitter
        time: 10.0
        type: Remove
      - !type:GenericStatusEffect
        key: Stutter
        time: 5.0
        type: Add
      - !type:HealthChange
        damage:
          types:
            Poison: 0.5

- type: reagent
  id: Opiates
  name: reagent-name-opiates
  group: Medicine
  desc: reagent-desc-opiates
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#cbccfc"
  bioavailability: 0.6
  metabolismRate: 0.02
  overdoseThreshold: 30
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Opiates
          min: 30
        damage:
          types:
            Poison: 2

