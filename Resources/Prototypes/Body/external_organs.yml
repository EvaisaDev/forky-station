# Baystation-style external organ (limb) definitions.
# Adds ExternalOrganComponent to existing external organ entities.

- type: entity
  parent: OrganHumanExternal
  id: OrganHumanExternalBay
  abstract: true
  suffix: bay_med
  components:
  - type: ExternalOrgan

# --- Torso ---
- type: entity
  parent: [ OrganHumanTorso, OrganHumanExternalBay ]
  id: OrganHumanTorsoBay
  components:
  - type: ExternalOrgan
    maxDamage: 200
    minBrokenDamage: 150
    flags:
    - HasTendon

# --- Head ---
- type: entity
  parent: [ OrganHumanHead, OrganHumanExternalBay ]
  id: OrganHumanHeadBay
  components:
  - type: ExternalOrgan
    maxDamage: 100
    minBrokenDamage: 40
    flags:
    - CanAmputate
    - CanBreak
    - HasTendon

