- type: entity
  id: ToppingDispenserEmpty
  name: Topping Dispenser
  suffix: Empty
  description: A Topping Dispenser with a single slot for a container to be filled.
  parent: ReagentDispenserBase
  components:
  - type: Rotatable
  - type: Sprite
    sprite: _Funkystation/Structures/Dispensers/toppingdispenser.rsi
    drawdepth: SmallObjects
    state: icecream
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - IcecreamIngredientJug
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: ToppingDispenserCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks

- type: entity
  id: ToppingDispenser
  suffix: Filled
  parent: ToppingDispenserEmpty
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkSugarJug
        - id: DrinkIceJug
        - id: DrinkCreamCartonXL
        - id: JugBerryJuice
        - id: JugChocolateSauce

