- type: entity
  id: IcecreamMachineEmpty
  name: Icecream Machine
  suffix: Empty
  description: An Icecream Machine with a single slot for a container to be filled.
  parent: ReagentDispenserBase
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: booze
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - IcecreamIngredientJug
  - type: Transform
    noRot: false
  - type: Machine
    board: IcecreamMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks

- type: entity
  id: IcecreamMachine
  suffix: Filled
  parent: IcecreamMachineEmpty
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: JugIcecream
