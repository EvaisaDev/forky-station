- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  description: A sterile operating table with built-in neural suppressors for anesthesia.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: OperativeTable
    anesthesiaActive: false
    surgeryQualityBonus: 1.0
    sterileEnvironment: true
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ActivatableUI
    key: enum.OperatingTableUiKey.Key
  - type: UserInterface
